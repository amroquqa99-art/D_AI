name: D_AI v2 checks

on:
  push:
    branches:
      - main
      - dai/**
  pull_request:
    paths:
      - 'packages/experimental/d-ai/**'
      - 'apps/cli/config/examples/d-ai/**'
      - 'packages/llm/llm-pi-ai/**'
      - 'patches/@earendil-works__pi-ai@0.87.1.patch'
      - 'packages/experimental/browser-use-stagehand-native/**'
      - 'pnpm-lock.yaml'
      - 'docs/PRODUCT_SPEC.md'
      - 'docs/ARCHITECTURE.md'
      - 'docs/FEATURE_MATRIX.md'
      - 'docs/MILESTONES.md'
      - 'D_AI_EXECUTION_STATUS_AR.md'
      - '.github/workflows/d-ai-v2-checks.yml'

permissions:
  contents: read

jobs:
  d-ai-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate and verify persistence catalog
        run: |
          pnpm run gen-persistence-catalog
          pnpm run verify-persistence-catalog
      - name: Build Harness native system addon
        run: pnpm run build:native-system
      - name: D_AI TypeScript package check
        run: pnpm exec tsc -b packages/experimental/d-ai/tsconfig.json --pretty false
      - name: Workspace build
        run: pnpm run build
      - name: Local provider context regressions
        run: pnpm exec vitest run packages/llm/llm-pi-ai/tests/small-context-budget.spec.ts packages/llm/llm-pi-ai/tests/adapter.spec.ts --maxWorkers=4
      - name: D_AI package tests
        run: pnpm exec vitest run packages/experimental/d-ai/tests --maxWorkers=4
