name: Desktop bridge contracts
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install core
        run: python -m pip install -e .
      - name: Verify Python bridge
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_desktop_bridge.py -v
      - name: Verify JavaScript client
        run: node --test tests/desktop-client.test.mjs
