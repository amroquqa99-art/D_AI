name: Import pinned Harness source
on:
  push:
    branches: [main]
    paths: [.github/workflows/d-ai-import.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: d-ai-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'amroquqa99-art/D_AI'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
      - name: Import exact source with complete ancestry
        shell: bash
        env:
          UPSTREAM_SHA: 5badb15009ae1756c3afe0ae0cef1faafc290ccc
        run: |
          set -euo pipefail
          git config user.name "D_AI source import"
          git config user.email "source-import@users.noreply.github.com"
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo "Pinned source ancestry already imported."
            exit 0
          fi
          if ! git merge --no-commit --no-ff --allow-unrelated-histories "$UPSTREAM_SHA"; then
            test "$(git diff --name-only --diff-filter=U)" = "README.md"
            git checkout --theirs -- README.md
            git add README.md
          fi
          # Upstream CI is repository-specific. Keep only this owner's workflows.
          git rm -r --cached --ignore-unmatch .github/workflows
          git checkout HEAD -- .github/workflows
          git commit -m "Import official Harness at $UPSTREAM_SHA with original ancestry"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          git diff --quiet "$UPSTREAM_SHA" HEAD -- packages vendor native apps python
          git push origin HEAD:main
