[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "d-ai"
version = "1.0.0"
description = "D_AI local shared intelligence, memory and coordinated host integrations"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["cryptography>=44,<47"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
dai = "dai.cli:main"
dai-mcp = "dai.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
